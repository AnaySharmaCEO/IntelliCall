version: "3.9"

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "echo Frontend service placeholder"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "echo Backend service placeholder"
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resonology
      POSTGRES_USER: resonology
      POSTGRES_PASSWORD: resonology
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
